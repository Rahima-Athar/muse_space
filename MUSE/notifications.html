<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — MUSE</title>
  <meta name="description" content="Stay updated with appreciation, feedback, and follows on MUSE." />
  
  <!-- CSS -->
  <!-- Google Fonts: Playfair Display (headings) + DM Sans (body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400;1,9..40,500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/projects.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="notifications-page">
  <!-- Shared Navbar -->
  <nav id="navbar" class="navbar" role="navigation" aria-label="Main Navigation"></nav>

  <main class="main-content">
    <div class="container section-sm">
      <div class="notifications-layout card">
        <!-- Header -->
        <div class="notifications-header">
          <div>
            <h1 class="page-title-sm">Community Activity</h1>
            <p class="text-muted">Notifications for likes, constructive comments, and new followers.</p>
          </div>
          <div class="notifications-actions">
            <button id="markAllReadBtn" class="btn btn-outline btn-sm">Mark All as Read</button>
          </div>
        </div>

        <!-- Filter tabs -->
        <div class="notifications-tabs">
          <button class="notif-tab active" data-filter="all">All</button>
          <button class="notif-tab" data-filter="unread">Unread</button>
        </div>

        <!-- Loading State -->
        <div id="notifsLoading" class="loading-state">
          <div class="spinner-ring"></div>
          <p>Loading activity...</p>
        </div>

        <!-- Notifications List -->
        <div class="notifications-list" id="notificationsList" style="display:none;"></div>

        <!-- Empty State -->
        <div id="notifsEmptyState" class="empty-state" style="display:none;">
          <div class="empty-icon">🔔</div>
          <h3 class="empty-title">All caught up!</h3>
          <p class="empty-desc">When creators appreciate your work, leave feedback, or follow you, updates will show here.</p>
          <a href="feed.html" class="btn btn-outline">Back to Feed</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Shared Footer -->
  <footer id="footer" class="footer" role="contentinfo"></footer>

  <!-- Scripts -->
  <script type="module" src="js/common.js"></script>
  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { getNotifications, markAllAsRead, renderNotificationItem, subscribeToNotifications } from './js/notifications.js';
    import { showToast } from './js/common.js';

    let allNotifs = [];
    let currentFilter = 'all';

    async function init() {
      const userRes = await requireAuth('login.html');
      if (!userRes?.user) return;
      const user = userRes.user;

      loadNotifications(user.id);

      // Subscribe to live notifications via Realtime
      subscribeToNotifications(user.id, (newNotif) => {
        allNotifs.unshift(newNotif);
        renderNotifications();
        showToast('New activity received!', 'info');
      });

      document.getElementById('markAllReadBtn').addEventListener('click', async () => {
        const { error } = await markAllAsRead(user.id);
        if (!error) {
          allNotifs.forEach(n => n.read = true);
          renderNotifications();
          showToast('Marked all as read', 'info');
        }
      });
    }

    async function loadNotifications(userId) {
      const loading = document.getElementById('notifsLoading');
      const { data } = await getNotifications(userId);
      loading.style.display = 'none';

      allNotifs = data || [];
      renderNotifications();
    }

    function renderNotifications() {
      const list = document.getElementById('notificationsList');
      const empty = document.getElementById('notifsEmptyState');

      let filtered = allNotifs;
      if (currentFilter === 'unread') {
        filtered = allNotifs.filter(n => !n.read);
      }

      if (filtered.length === 0) {
        list.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      list.style.display = 'flex';
      list.innerHTML = '';

      filtered.forEach(n => {
        const el = renderNotificationItem(n);
        list.appendChild(el);
      });
    }

    // Tabs
    document.querySelectorAll('.notif-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderNotifications();
      });
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
