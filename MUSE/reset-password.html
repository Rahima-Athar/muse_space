<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — MUSE</title>
  <meta name="description" content="Choose a new password for your MUSE creator account." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400;1,9..40,500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo" aria-label="MUSE Home">
        <span class="logo-mark">M</span>
        <span class="logo-text">MUSE</span>
      </a>
      <h1 class="auth-title">Set a new password</h1>
      <p class="auth-subtitle">Choose a new password for <strong id="resetEmailLabel">your account</strong>.</p>
    </div>

    <div id="authAlert" class="auth-alert" style="display:none;" role="alert"></div>

    <form id="resetForm" class="auth-form" style="display:none;" novalidate>
      <div class="form-group">
        <label for="newPassword" class="form-label">New Password</label>
        <div class="input-toggle-wrap">
          <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password" />
          <button type="button" class="btn-toggle-pwd" id="togglePassword" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Re-enter your new password" required autocomplete="new-password" />
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
        <span class="btn-text">Update Password</span>
      </button>
    </form>

    <div class="auth-footer">
      <p id="backToLoginWrap" style="display:none;"><a href="login.html" class="auth-link">Back to sign in</a></p>
      <p id="requestNewWrap" style="display:none;"><a href="login.html#forgot" class="auth-link">Request a new reset link</a></p>
    </div>
  </div>

  <script type="module" src="js/common.js"></script>
  <script type="module">
    import { supabase, getSupabaseConfig } from './js/supabase.js';
    import { showToast } from './js/common.js';

    const alertBox = document.getElementById('authAlert');
    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('newPassword');
    const confirmInput = document.getElementById('confirmPassword');
    const emailLabel = document.getElementById('resetEmailLabel');
    const backToLoginWrap = document.getElementById('backToLoginWrap');
    const requestNewWrap = document.getElementById('requestNewWrap');

    let recoverySession = null;

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `auth-alert auth-alert-${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function hasRecoveryParams() {
      const source = `${window.location.hash || ''}${window.location.search || ''}`;
      return /(access_token|refresh_token|type=recovery|code=|error_description|error=)/.test(source);
    }

    function readUrlError() {
      const raw = (window.location.hash || '').replace(/^#/, '');
      const params = new URLSearchParams(raw);
      const description = params.get('error_description') || params.get('error');
      return description ? decodeURIComponent(description.replace(/\+/g, ' ')) : null;
    }

    async function waitForRecoverySession() {
      const { data } = await supabase.auth.getSession();
      if (data?.session) return data.session;
      if (!hasRecoveryParams()) return null;

      return new Promise((resolve) => {
        let settled = false;
        let subscription = null;

        const finish = (session) => {
          if (settled) return;
          settled = true;
          try { subscription?.data?.subscription?.unsubscribe?.(); } catch { /* ignore */ }
          resolve(session);
        };

        subscription = supabase.auth.onAuthStateChange((event, session) => {
          if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) finish(session);
        });

        setTimeout(async () => {
          try {
            const { data: late } = await supabase.auth.getSession();
            finish(late?.session || null);
          } catch {
            finish(null);
          }
        }, 4000);
      });
    }

    function showExpired() {
      showAlert('This reset link is invalid or has expired. Please request a new password reset email.', 'error');
      requestNewWrap.style.display = 'block';
      backToLoginWrap.style.display = 'block';
    }

    function toggleVisibility() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      confirmInput.setAttribute('type', type);
    }

    document.getElementById('togglePassword')?.addEventListener('click', toggleVisibility);

    async function init() {
      if (!getSupabaseConfig().isConnected) {
        showAlert('Supabase is not connected. Add your project URL and anon key in js/supabase.js.', 'error');
        return;
      }

      const urlError = readUrlError();
      if (urlError) {
        showAlert(urlError, 'error');
        requestNewWrap.style.display = 'block';
        backToLoginWrap.style.display = 'block';
        return;
      }

      recoverySession = await waitForRecoverySession();

      if (!recoverySession?.user) {
        showExpired();
        return;
      }

      emailLabel.textContent = recoverySession.user.email || 'your account';
      form.style.display = 'block';
      passwordInput.focus();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideAlert();

      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters long.', 'error');
        passwordInput.focus();
        return;
      }

      if (password !== confirm) {
        showAlert('Passwords do not match. Please try again.', 'error');
        confirmInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('btn-loading');
      submitBtn.querySelector('.btn-text').textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({ password });

      submitBtn.disabled = false;
      submitBtn.classList.remove('btn-loading');
      submitBtn.querySelector('.btn-text').textContent = 'Update Password';

      if (error) {
        showAlert(error.message || 'Could not update your password. Please try again.', 'error');
        return;
      }

      showToast('Password updated successfully! Please sign in.', 'success');
      form.style.display = 'none';

      try {
        await supabase.auth.signOut();
      } catch { /* ignore */ }

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    });

    await init();
  </script>
</body>
</html>
